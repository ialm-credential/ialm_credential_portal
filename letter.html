<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IALM · Letter</title>
  <meta name="description" content="IALM letter language selection page">
  <link rel="icon" type="image/png" href="ialm-logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="letter">
  <nav class="top-nav" aria-label="Page navigation">
    <span>HOME PAGE</span>
    <button type="button" disabled>RECENTLY VISITED: CREDENTIAL RECORD</button>
  </nav>

  <div class="letter-shell">
    <header class="letter-header">
      <div class="letter-logo" aria-label="IALM logo">
        <img src="ud.png" alt="IALM logo">
      </div>

      <div class="letter-branding">
        <div class="letter-org">INTERNATIONAL ASSOCIATION<br>OF LOVE MEDICINE</div>
        <div class="letter-credential">IALM Credentialing &amp; Membership Office</div>
        <div class="letter-address">Aareweg, 18 · 9321 Bern · Switzerland</div>
        <div class="letter-registry">Reg. No. CH-0347-3921 · Member Services Division</div>
      </div>

      <div class="letter-registry-tag">REGISTRY 03.4</div>
    </header>

    <main class="letter-panel">
      <article id="letterContent" class="letter-article" aria-live="polite"></article>

      <div id="languageModal" class="language-modal is-visible" aria-live="polite">
        <div class="language-modal-inner">
          <div class="language-select-panel">
            <div class="language-panel-label">SELECT TRANSLATION LANGUAGE</div>
            <div class="lang-selector-stack" aria-label="Select letter language">
  <button type="button" class="lang-tile" data-lang="ru">
    <span class="lang-code">RU</span>
    <span class="lang-name">Русский</span>
  </button>

  <button type="button" class="lang-tile" data-lang="es">
    <span class="lang-code">ES</span>
    <span class="lang-name">Español</span>
  </button>

  <button type="button" class="lang-tile" data-lang="fr">
    <span class="lang-code">FR</span>
    <span class="lang-name">Français</span>
  </button>

  <button type="button" class="lang-tile" data-lang="de">
    <span class="lang-code">DE</span>
    <span class="lang-name">Deutsch</span>
  </button>
</div>
          </div>

          <div id="languageLoading" class="language-loading" aria-live="polite" aria-hidden="true">
            <div class="loading-ring compact"></div>
            <div class="loading-copy">Preparing translation...</div>
          </div>
        </div>
      </div>
    </main>

    <div class="letter-footer-bar">
      <button id="homeLetterButton" type="button" class="home-letter-btn">GO TO MAIN PAGE</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
